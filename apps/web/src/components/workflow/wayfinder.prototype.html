<div id="t3-wayfinder-prototype" aria-label="T3 Code Workflow prototype">
  <div class="wf-shell">
    <aside class="wf-rail" aria-label="T3 Code navigation">
      <div class="wf-brand">T3 <span>Code</span></div>
      <nav class="wf-nav">
        <button type="button" data-page="workflow" aria-pressed="true">
          Workflow
        </button>
        <button type="button" data-page="threads" aria-pressed="false">
          Threads <span id="wf-thread-count">0</span>
        </button>
      </nav>
      <div class="wf-project">
        <div class="wf-eyebrow">Project</div>
        <p>t3code</p>
        <p class="wf-muted">Local environment</p>
      </div>
      <div class="wf-project">
        <div class="wf-eyebrow">Source</div>
        <p>GitHub Issues</p>
        <p class="wf-muted">Flow-Fly/t3code</p>
      </div>
    </aside>
    <main class="wf-main">
      <header class="wf-topbar">
        <span
          ><span class="wf-muted">t3code / </span
          ><span id="wf-breadcrumb">Workflow</span></span
        ><span class="wf-sample"
          >Prototype · sample state · simulated agents</span
        >
      </header>
      <div id="wf-view"></div>
    </main>
  </div>
  <footer class="wf-footer">
    <span id="wf-announcement" class="wf-muted" role="status" aria-live="polite"
      >Select an item to inspect its work.</span
    >

      <button type="button" data-cycle="-1" aria-label="Previous layout">
        ←
      </button>
      <span id="wf-variant-label">A · Workspace</span>
      <button type="button" data-cycle="1" aria-label="Next layout">→</button>
    </div>
  </footer>
  <details class="wf-state">
    <summary>Prototype state</summary>
    <pre id="wf-state-output"></pre>
  </details>
</div>

<script>
  (() => {
    const root = document.getElementById("t3-wayfinder-prototype");
    const view = root.querySelector("#wf-view");
    const variants = {
      A: "Workspace",
      B: "Board",
      C: "Outline",
      D: "Mind map",
    };
    const initialVariant = new URLSearchParams(location.search).get("variant");
    const state = {
      variant: variants[initialVariant] ? initialVariant : "D",
      section: "frontier",
      page: "workflow",
      selected: "tracking",
      thread: null,
      threads: [],
    };
    const graph = {
      layout: "mind",
      zoom: 1,
      x: 0,
      y: 0,
      fitted: false,
      inspector: false,
      positions: {},
      decisions: true,
      delivery: true,
      resolved: false,
      allDecisions: false,
      allDelivery: false,
    };
    const items = [
      {
        id: "maproot",
        kind: "Map",
        title: "Bring workflow tracking into T3 Code",
        summary:
          "Find the route to a workflow view that follows decisions and delivery, and starts correctly instructed agent work.",
        question:
          "Destination: a prototype-informed, owner-approved specification for web and desktop.",
        status: "ready",
        blockers: [],
        skill: "$wayfinder",
        url: "https://github.com/Flow-Fly/t3code/issues/1",
      },
      {
        id: "fog",
        kind: "Unspecified",
        title: "Beyond the current frontier",
        summary:
          "Many projects and simultaneous capabilities; older trackers with different conventions; reopened and superseded work. These questions are still too broad to turn into decision tickets.",
        status: "blocked",
        blockers: [],
        skill: "$wayfinder",
      },
      {
        id: "tracking",
        kind: "Decision",
        title: "Define the tracker contract",
        summary:
          "Agree how maps, capabilities, specifications and tickets are connected, and what each status means.",
        question:
          "What should distinguish a resolved decision from completed delivery, and how should those relationships appear in GitHub?",
        status: "ready",
        blockers: [],
        skill: "$wayfinder · $grill-with-docs",
        url: "https://github.com/Flow-Fly/t3code/issues/3",
      },
      {
        id: "layout",
        kind: "Decision",
        title: "Choose the Workflow view",
        summary:
          "Compare three layouts with the owner before committing to the navigation and detail view.",
        status: "running",
        blockers: [],
        assignee: "Flow-Fly",
        skill: "$wayfinder · $prototype",
        url: "https://github.com/Flow-Fly/t3code/issues/2",
      },
      {
        id: "models",
        kind: "Research",
        title: "Verify skill and model controls",
        summary:
          "Find which provider settings can enforce the director, implementation and independent review profile.",
        resolution:
          "Codex can configure child model settings; T3 can observe actual activity. Explicit skill injection and host-enforced role selection need separate implementation decisions.",
        status: "resolved",
        blockers: [],
        skill: "$wayfinder · $research",
        url: "https://github.com/Flow-Fly/t3code/issues/4",
      },
      {
        id: "launch",
        kind: "Decision",
        title: "Define immediate thread launch",
        summary:
          "Settle claims, repeat clicks, environment selection, failed starts and how to return to existing work.",
        status: "blocked",
        blockers: ["layout", "models"],
        skill: "$wayfinder · $grill-with-docs",
        url: "https://github.com/Flow-Fly/t3code/issues/5",
      },
      {
        id: "handoff",
        kind: "Decision",
        title: "Define specification and delivery handoffs",
        summary:
          "Make the next step clear as decisions become an approved specification and executable tickets.",
        status: "blocked",
        blockers: ["tracking"],
        skill: "$wayfinder · $grill-with-docs",
        url: "https://github.com/Flow-Fly/t3code/issues/6",
      },
      {
        id: "verification",
        kind: "Decision",
        title: "Choose tracking freshness and verification",
        summary:
          "Agree how fresh tracker state must be and how to prove the launch works across local and remote environments.",
        status: "blocked",
        blockers: ["layout", "tracking", "launch", "handoff"],
        skill: "$wayfinder · $grill-with-docs",
        url: "https://github.com/Flow-Fly/t3code/issues/7",
      },
      {
        id: "scope",
        kind: "Decision",
        title: "Begin with web and desktop",
        summary:
          "The first version uses the shared web client, including its desktop shell. Mobile follows later.",
        resolution:
          "Start with web and desktop. Keep server and shared client contracts suitable for a later native mobile view.",
        status: "resolved",
        blockers: [],
        skill: "$wayfinder",
        sample: true,
      },
      {
        id: "capability",
        kind: "Capability",
        title: "Start agent work from the workflow",
        summary:
          "Move from a decision or capability into an agent thread with the right context, skills and model profile. Keep that thread linked to its source work.",
        status: "ready",
        blockers: [],
        skill: "$implement · $code-review",
        children: ["identity", "prompt", "submit", "resume", "recover"],
        sample: true,
      },
      {
        id: "identity",
        kind: "Delivery ticket",
        title: "Keep the source issue attached to a thread",
        summary:
          "Return from an active thread to the capability or decision that started it.",
        status: "resolved",
        blockers: [],
        skill: "$implement",
        parent: "capability",
        sample: true,
      },
      {
        id: "prompt",
        kind: "Delivery ticket",
        title: "Prepare context and the required skills",
        summary:
          "Include source links, the selected question, standing notes and the director profile.",
        status: "resolved",
        blockers: [],
        skill: "$implement",
        parent: "capability",
        sample: true,
      },
      {
        id: "submit",
        kind: "Delivery ticket",
        title: "Start the thread immediately",
        summary:
          "One Start work action creates the thread and sends the prepared first turn.",
        status: "ready",
        blockers: ["identity", "prompt"],
        skill: "$implement",
        parent: "capability",
        sample: true,
      },
      {
        id: "resume",
        kind: "Delivery ticket",
        title: "Return to work already in progress",
        summary:
          "Open the linked thread when this item already has active work.",
        status: "blocked",
        blockers: ["submit"],
        skill: "$implement",
        parent: "capability",
        sample: true,
      },
      {
        id: "recover",
        kind: "Delivery ticket",
        title: "Recover from a failed launch",
        summary:
          "Show the failure and let the user safely retry without duplicating the thread.",
        status: "blocked",
        blockers: ["submit"],
        skill: "$implement",
        parent: "capability",
        sample: true,
      },
      {
        id: "specmap",
        kind: "Map",
        title: "Bring project context into new threads",
        summary:
          "A sample map whose decisions are resolved and remaining fog is cleared. Its next step is a specification.",
        status: "ready",
        blockers: [],
        skill: "$to-spec",
        sample: true,
      },
      {
        id: "unsliced",
        kind: "Capability",
        title: "Keep project context with every thread",
        summary:
          "An approved sample specification ready to be split into independently verifiable delivery tickets.",
        status: "ready",
        blockers: [],
        skill: "$to-tickets",
        approved: true,
        sample: true,
      },
    ];
    const get = (id) => items.find((item) => item.id === id);
    const escape = (value) =>
      String(value).replace(
        /[&<>"']/g,
        (char) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[char],
      );
    const decisionItems = () =>
      items.filter(
        (item) => item.kind === "Decision" || item.kind === "Research",
      );
    const labels = {
      ready: "Ready",
      running: "In progress",
      blocked: "Blocked",
      resolved: "Resolved",
      approval: "Needs approval",
    };
    const status = (item) =>
      `<span class="wf-status" data-state="${item.status}">${labels[item.status]}</span>`;
    const openBlockers = (item) =>
      item.blockers.map(get).filter((blocker) => blocker.status !== "resolved");
    const frontier = () =>
      decisionItems().filter(
        (item) =>
          item.status === "ready" &&
          !item.assignee &&
          openBlockers(item).length === 0,
      );

    function row(item) {
      return `<button type="button" class="wf-item" data-select="${item.id}" aria-pressed="${state.selected === item.id}"><span><span class="wf-eyebrow">${item.kind}${item.sample ? " · example" : ""}</span><span class="wf-item-title">${escape(item.title)}</span></span><span class="wf-item-meta">${status(item)}${item.assignee ? `<span>${item.assignee}</span>` : ""}</span></button>`;
    }

    function group(title, list) {
      return `<section class="wf-group"><div class="wf-group-title"><h3>${title}</h3><span class="wf-count">${list.length}</span></div>${list.length ? list.map(row).join("") : '<p class="wf-empty">No items here.</p>'}</section>`;
    }

    function promptFor(item) {
      if (item.id === "maproot")
        return "$wayfinder https://github.com/Flow-Fly/t3code/issues/1\nRead the destination and notes. Re-read the live frontier, choose one open, unblocked, unclaimed decision ticket, claim it, and use its required skills. Resolve at most that one decision with the owner where human input is required.";
      const source =
        item.url || `[sample ${item.kind.toLowerCase()}: ${item.title}]`;
      if (item.skill === "$to-spec")
        return `$to-spec\n\nRead the map ${source}, its resolution comments and standing notes. Its decision work and remaining fog are complete. Synthesize the capability specification from those decisions. Confirm the testing seams, publish the spec, and wait for owner approval before $to-tickets.`;
      if (item.skill === "$to-tickets")
        return `$to-tickets\n\nRead the approved capability specification ${source}. Propose tracer-bullet delivery tickets and genuine blocking edges. Get owner approval of the breakdown before publishing. Mark only the executable frontier ready-for-agent.`;
      if (item.kind === "Capability")
        return `Act as workflow-director for ${source}.\nDirector: Astra high. Implementation subagents: Sol high using $implement. Independent review: Astra medium using $code-review.\n\nRead the full approved specification, child tickets, dependencies and live readiness labels. Execute only approved, unblocked work. Give each worker explicit write ownership. Preserve spec source, fixed point, exact implementation head and verification evidence for fresh review. Re-read tracker state before selecting the next ticket. Pause for unresolved product decisions. Apply the repository's approval rules for merges.`;
      if (item.kind === "Delivery ticket")
        return `$implement\n\nWork on ${source}, under its approved capability. Re-read acceptance criteria, readiness and blockers before editing. Return spec source, fixed point, exact head and verification evidence to the director. Independent $code-review follows in a fresh Astra medium session.`;
      return `$wayfinder https://github.com/Flow-Fly/t3code/issues/1\nWork on the decision “${item.title}”: ${source}\n\nUse ${item.kind === "Research" ? "$research" : item.id === "layout" ? "$prototype" : "$grill-with-docs ($grilling and $domain-modeling)"}. Read map notes and relevant resolution comments. Re-read live blockers and assignee, claim this ticket before work, and resolve at most this one decision. Record the answer in a resolution comment and update the map's index and newly visible frontier. Human-in-the-loop decisions require the owner's live answers.`;
    }

    function actionLabel(item) {
      if (state.threads.some((thread) => thread.item === item.id))
        return "Open thread";
      if (item.status === "resolved") return "Resolved";
      if (item.id === "fog") return "Not yet a decision ticket";
      if (openBlockers(item).length) return "Waiting on blockers";
      if (item.assignee) return "Already claimed";
      if (item.kind === "Capability" && item.children) return "Start director";
      if (item.id === "maproot") return "Continue wayfinding";
      if (item.skill === "$to-spec") return "Start $to-spec";
      if (item.skill === "$to-tickets") return "Start $to-tickets";
      return "Start work";
    }

    function ticketRows(ids) {
      return ids
        .map(get)
        .map(
          (item) =>
            `<button type="button" class="wf-ticket" data-select="${item.id}"><span>${escape(item.title)}<small>${escape(item.summary)}</small></span>${status(item)}</button>`,
        )
        .join("");
    }

    function detail() {
      const item = get(state.selected);
      const blockers = openBlockers(item);
      const hasThread = state.threads.some((thread) => thread.item === item.id);
      const disabled =
        !hasThread &&
        (item.status === "resolved" ||
          item.status === "blocked" ||
          item.assignee ||
          blockers.length);
      const children = (item.children || []).map(get);
      const done = children.filter(
        (ticket) => ticket.status === "resolved",
      ).length;
      const director =
        item.parent &&
        state.threads.find((thread) => thread.item === item.parent);
      return `<article class="wf-detail" aria-label="Selected work details"><div class="wf-item-meta"><span class="wf-eyebrow">${item.kind}${item.sample ? " · example" : ""}</span>${status(item)}</div><h2>${escape(item.title)}</h2><p class="wf-description">${escape(item.summary)}</p>
      ${item.question ? `<section class="wf-detail-section"><h3>Question to settle</h3><p>${escape(item.question)}</p></section>` : ""}
      ${item.resolution ? `<section class="wf-detail-section"><h3>Decision</h3><p>${escape(item.resolution)}</p></section>` : ""}
      ${children.length ? `<section class="wf-detail-section"><div class="wf-group-title"><h3>Delivery tickets</h3><span class="wf-count">${done} of ${children.length} resolved</span></div><progress value="${done}" max="${children.length}" aria-label="Resolved delivery tickets"></progress>${ticketRows(item.children)}</section>` : ""}
      ${blockers.length ? `<section class="wf-detail-section"><h3>Blocked by</h3>${blockers.map(row).join("")}</section>` : ""}
      ${item.parent ? `<div class="wf-detail-section wf-actions"><button type="button" class="wf-secondary" data-select="${item.parent}">Back to capability</button>${director ? `<button type="button" class="wf-secondary" data-thread="${director.id}">Open director thread</button>` : ""}</div>` : ""}
      ${item.approved ? '<p class="wf-hint">Sample spec: owner approval recorded. Ticket breakdown still needs approval.</p>' : ""}
      <section class="wf-detail-section"><h3>${item.kind === "Capability" && item.children ? "Workflow director" : "Agent instructions"}</h3><div class="wf-profile"><span>${item.kind === "Delivery ticket" ? "Sol · high" : "Astra · high"}</span>${item.kind === "Capability" && item.children ? "<span>Build: Sol · high</span><span>Review: Astra · medium</span>" : ""}</div><p class="wf-hint">${escape(item.skill)}</p><details style="margin-top:12px"><summary>View prepared instructions</summary><pre>${escape(promptFor(item))}</pre></details><div class="wf-actions"><button type="button" class="wf-primary" data-start="${item.id}" ${disabled ? "disabled" : ""}>${actionLabel(item)}${disabled ? "" : " ↗"}</button>${item.url ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>` : ""}</div><p class="wf-hint">${hasThread ? "Return to the linked thread." : disabled ? "Browse details while this work is unavailable." : "Creates a thread and sends the instructions immediately."}</p></section></article>`;
    }

    function listContent() {
      if (state.section === "capabilities")
        return group(
          "Capabilities",
          items.filter((item) => item.kind === "Capability"),
        );
      if (state.section === "decisions")
        return (
          group(
            "Decisions so far",
            decisionItems().filter((item) => item.status === "resolved"),
          ) +
          group(
            "Open decisions",
            decisionItems().filter((item) => item.status !== "resolved"),
          )
        );
      if (state.section === "maps")
        return (
          `<section class="wf-group"><div class="wf-eyebrow">Wayfinder map</div><h2 style="margin:9px 0">Bring workflow tracking into T3 Code</h2><p class="wf-muted">Find the route from a workflow view to correctly instructed agent work.</p><div class="wf-detail-section"><h3>Destination</h3><p class="wf-muted">A prototype-informed, owner-approved specification for web and desktop.</p></div><div class="wf-detail-section"><h3>Not yet specified</h3><ul><li>Many projects and simultaneous capabilities</li><li>Existing trackers with different conventions</li><li>Reopened and superseded work</li></ul></div><div class="wf-detail-section"><h3>Out of scope</h3><p class="wf-muted">Mobile for the first version; automatic approval or merge authority.</p></div><div class="wf-actions"><a href="https://github.com/Flow-Fly/t3code/issues/1" target="_blank" rel="noopener noreferrer">Open planning map ↗</a></div></section>` +
          group("Ready for specification · example", [get("specmap")])
        );
      return (
        group("Frontier", frontier()) +
        group(
          "In progress",
          decisionItems().filter((item) => item.status === "running"),
        ) +
        `<details class="wf-group"><summary>Blocked decisions · ${decisionItems().filter((item) => item.status === "blocked").length}</summary>${decisionItems()
          .filter((item) => item.status === "blocked")
          .map(row)
          .join("")}</details>`
      );
    }

    function board() {
      const list =
        state.section === "capabilities"
          ? items.filter((item) => item.kind === "Capability" || item.parent)
          : decisionItems();
      const lanes = [
        ["Ready", ["ready"]],
        ["In progress", ["running"]],
        ["Blocked / resolved", ["blocked", "resolved"]],
      ];
      return `<div class="wf-board">${lanes
        .map(
          ([title, states]) =>
            `<section class="wf-lane"><h3>${title}</h3>${
              list
                .filter((item) => states.includes(item.status))
                .map(row)
                .join("") || '<p class="wf-empty">No work here.</p>'
            }</section>`,
        )
        .join("")}</div>${detail()}`;
    }

    function outline() {
      return `<div class="wf-outline"><details open><summary>Wayfinder · Bring workflow tracking into T3 Code</summary><div class="wf-branch">${decisionItems().map(row).join("")}</div></details><details open><summary>Capability · Start agent work from the workflow</summary><div class="wf-branch">${row(get("capability"))}${get("capability").children.map(get).map(row).join("")}</div></details><details><summary>Next handoffs · examples</summary><div class="wf-branch">${row(get("specmap"))}${row(get("unsliced"))}</div></details></div>${detail()}`;
    }

    let mapModel = { nodes: [], edges: [] };

    function graphModel() {
      const open = decisionItems().filter((item) => item.status !== "resolved");
      const closed = decisionItems().filter(
        (item) => item.status === "resolved",
      );
      const nodes = [
        {
          id: "maproot",
          x: 405,
          y: 307,
          w: 236,
          h: 154,
          tone: "map",
          title: "Workflow tracking in T3 Code",
          label: "Wayfinder map",
          meta: `${open.length} open decisions · ${frontier().length} in frontier`,
        },
        {
          id: "decisions",
          x: 81,
          y: 189,
          w: 224,
          h: 137,
          tone: "decision",
          title: "Find the way forward",
          label: "Decision branches",
          meta: `${frontier().length} ready · ${open.filter((item) => item.assignee).length} claimed`,
          toggle: "decisions",
        },
        {
          id: "capability",
          x: 711,
          y: 335,
          w: 238,
          h: 174,
          tone: "capability",
          title: "Start agent work",
          label: "Capability · example",
          meta: `${get("capability").children.filter((id) => get(id).status === "resolved").length} of 5 tickets resolved`,
          toggle: "delivery",
        },
        {
          id: "resolved",
          x: 272,
          y: 589,
          w: 224,
          h: 126,
          tone: "muted",
          title: "Decisions so far",
          label: "The route already walked",
          meta: `${closed.length} resolved · expand to read`,
          toggle: "resolved",
        },
        {
          id: "fog",
          x: 569,
          y: 632,
          w: 234,
          h: 119,
          tone: "muted",
          title: "Not yet specified",
          label: "Beyond the frontier",
          meta: "3 areas still taking shape",
        },
      ];
      const edges = [
        { from: "maproot", to: "decisions", tone: "decision" },
        {
          from: "maproot",
          to: "capability",
          tone: "capability",
          handoff: true,
        },
        { from: "maproot", to: "resolved" },
        { from: "maproot", to: "fog", handoff: true },
      ];
      function add(id, x, y, parent, tone) {
        nodes.push({ id, x, y, w: 224, h: 132, tone });
        edges.push({ from: parent, to: id, tone });
      }
      if (graph.decisions) {
        const positions = [
          [25, 18],
          [304, 26],
          [8, 373],
          [11, 559],
          [11, 739],
        ];
        const ids = (graph.allDecisions ? open : open.slice(0, 3)).map(
          (item) => item.id,
        );
        ids.forEach((id, index) =>
          add(id, ...positions[index], "decisions", "decision"),
        );
      }
      if (graph.delivery) {
        add("submit", 729, 91, "capability", "capability");
        add("resume", 1007, 284, "capability", "capability");
        add("recover", 1000, 516, "capability", "capability");
        if (graph.allDelivery) {
          add("identity", 732, -88, "capability", "muted");
          add("prompt", 1012, 97, "capability", "muted");
        }
      }
      if (graph.resolved) {
        closed.forEach((item, index) =>
          add(item.id, 283 + index * 267, 829, "resolved", "muted"),
        );
      }
      if (graph.layout === "tree") {
        const tree = {
          maproot: [550, 20],
          decisions: [222, 241],
          capability: [876, 241],
          resolved: [19, 742],
          fog: [1235, 231],
          tracking: [14, 465],
          layout: [272, 465],
          launch: [530, 465],
          handoff: [273, 670],
          verification: [529, 670],
          submit: [811, 485],
          resume: [1064, 485],
          recover: [1317, 485],
          identity: [938, 701],
          prompt: [1203, 701],
          models: [18, 946],
          scope: [282, 946],
        };
        nodes.forEach((node) => {
          [node.x, node.y] = tree[node.id];
        });
      }
      nodes.forEach((node) => Object.assign(node, graph.positions[node.id]));
      return { nodes, edges };
    }

    function curve(from, to) {
      const a = { x: from.x + from.w / 2, y: from.y + from.h / 2 };
      const b = { x: to.x + to.w / 2, y: to.y + to.h / 2 };
      if (Math.abs(b.x - a.x) > Math.abs(b.y - a.y)) {
        a.x += ((b.x > a.x ? 1 : -1) * from.w) / 2;
        b.x += ((b.x > a.x ? -1 : 1) * to.w) / 2;
        const middle = (a.x + b.x) / 2;
        return `M ${a.x} ${a.y} C ${middle} ${a.y}, ${middle} ${b.y}, ${b.x} ${b.y}`;
      }
      a.y += ((b.y > a.y ? 1 : -1) * from.h) / 2;
      b.y += ((b.y > a.y ? -1 : 1) * to.h) / 2;
      const middle = (a.y + b.y) / 2;
      return `M ${a.x} ${a.y} C ${a.x} ${middle}, ${b.x} ${middle}, ${b.x} ${b.y}`;
    }

    function graphEdges() {
      return mapModel.edges
        .map((edge) => {
          const from = mapModel.nodes.find((node) => node.id === edge.from);
          const to = mapModel.nodes.find((node) => node.id === edge.to);
          return `<path d="${curve(from, to)}" data-tone="${edge.tone || "muted"}" data-selected="${graph.inspector && (edge.to === state.selected || edge.from === state.selected)}" data-handoff="${Boolean(edge.handoff)}" />`;
        })
        .join("");
    }

    function graphNode(node) {
      const item = get(node.id);
      const group = !item;
      const title = node.title || item.title;
      const ready = item && frontier().includes(item);
      const action = group
        ? `data-toggle="${node.toggle}"`
        : `data-select="${node.id}"`;
      return `<article class="wf-node" data-node="${node.id}" data-tone="${node.tone}" data-selected="${graph.inspector && state.selected === node.id}" data-frontier="${Boolean(ready)}" style="left:${node.x}px;top:${node.y}px;width:${node.w}px">
        <button type="button" class="wf-node-main" ${action} aria-label="${escape(title)}${group ? ", expand or collapse branch" : ", view details"}">
          <span class="wf-node-kind">${node.label || item.kind}</span>
          <span class="wf-node-name">${escape(title)}</span>
          <span class="wf-node-meta">${node.meta || `${status(item)}${ready ? "<span>Frontier</span>" : ""}`}</span>
        </button>
        ${node.toggle ? `<button type="button" class="wf-node-expand" data-toggle="${node.toggle}" aria-expanded="${graph[node.toggle]}">${graph[node.toggle] ? "− Collapse branch" : "+ Expand branch"}</button>` : ""}
        ${node.id === "decisions" && graph.decisions ? `<button type="button" class="wf-node-expand" data-toggle="allDecisions">${graph.allDecisions ? "Show first branches" : "Show all open decisions"}</button>` : ""}
        ${node.id === "capability" && graph.delivery ? `<button type="button" class="wf-node-expand" data-toggle="allDelivery">${graph.allDelivery ? "Hide resolved tickets" : "Show resolved tickets"}</button>` : ""}
      </article>`;
    }

    function mindMap() {
      mapModel = graphModel();
      return `<header class="wf-map-header"><div><h1>Workflow map</h1><p>From open questions to working capabilities.</p></div><div class="wf-map-tools"><label><span class="wf-muted">Layout </span><select aria-label="Node layout" data-map-layout><option value="mind" ${graph.layout === "mind" ? "selected" : ""}>Mind map</option><option value="tree" ${graph.layout === "tree" ? "selected" : ""}>Top to bottom</option></select></label><button type="button" class="wf-secondary" data-select="${frontier()[0]?.id || "maproot"}">${frontier().length} in frontier ↗</button></div></header>
        <section class="wf-map-canvas" aria-label="Workflow mind map. Drag the canvas to pan, drag nodes to arrange them, or use the zoom controls.">
          <div class="wf-map-scene"><svg class="wf-map-edges" width="1" height="1" aria-hidden="true">${graphEdges()}</svg>${mapModel.nodes.map(graphNode).join("")}</div>
          <div class="wf-map-legend"><span>Branch</span><span>Handoff / unexplored</span></div>
          <div class="wf-map-controls" aria-label="Map navigation"><button type="button" data-map-zoom="-1" aria-label="Zoom out">−</button><output id="wf-zoom-label">100%</output><button type="button" data-map-zoom="1" aria-label="Zoom in">+</button><button type="button" data-map-fit>Fit map</button></div>
          ${graph.inspector ? `<aside class="wf-map-inspector" aria-label="Node details"><div class="wf-map-inspector-header"><span>Selected node</span><button type="button" data-close-inspector aria-label="Close node details">Close ×</button></div>${detail()}</aside>` : ""}
        </section>`;
    }

    function syncGraph() {
      const canvas = root.querySelector(".wf-map-canvas");
      if (!canvas) return;
      const scene = canvas.querySelector(".wf-map-scene");
      scene.style.transform = `translate(${graph.x}px, ${graph.y}px) scale(${graph.zoom})`;
      canvas.querySelector("#wf-zoom-label").textContent =
        `${Math.round(graph.zoom * 100)}%`;
    }

    function measureGraph() {
      mapModel.nodes.forEach((node) => {
        const element = root.querySelector(`[data-node="${node.id}"]`);
        node.h = element.offsetHeight || node.h;
      });
      root.querySelector(".wf-map-edges").innerHTML = graphEdges();
    }

    function fitGraph(initial = false) {
      const canvas = root.querySelector(".wf-map-canvas");
      if (!canvas || !canvas.clientWidth) return;
      const minX = Math.min(...mapModel.nodes.map((node) => node.x));
      const minY = Math.min(...mapModel.nodes.map((node) => node.y));
      const maxX = Math.max(...mapModel.nodes.map((node) => node.x + node.w));
      const maxY = Math.max(...mapModel.nodes.map((node) => node.y + node.h));
      graph.zoom = Math.min(
        1,
        (canvas.clientWidth - 80) / (maxX - minX),
        (canvas.clientHeight - 80) / (maxY - minY),
      );
      graph.zoom = Math.max(0.4, graph.zoom);
      if (initial && canvas.clientWidth < 800) {
        graph.zoom = 0.85;
        const center = mapModel.nodes.find((node) => node.id === "maproot");
        graph.x =
          canvas.clientWidth / 2 - (center.x + center.w / 2) * graph.zoom;
        graph.y =
          canvas.clientHeight / 2 - (center.y + center.h / 2) * graph.zoom;
      } else {
        graph.x =
          (canvas.clientWidth - (maxX - minX) * graph.zoom) / 2 -
          minX * graph.zoom;
        graph.y =
          (canvas.clientHeight - (maxY - minY) * graph.zoom) / 2 -
          minY * graph.zoom;
      }
      graph.fitted = true;
      syncGraph();
      writePrototypeState();
    }

    function focusGraph(id) {
      const node = mapModel.nodes.find((candidate) => candidate.id === id);
      const canvas = root.querySelector(".wf-map-canvas");
      if (!node || !canvas || !canvas.clientWidth) return;
      const availableWidth =
        canvas.clientWidth -
        (graph.inspector && canvas.clientWidth > 700 ? 365 : 0);
      const availableHeight =
        canvas.clientHeight *
        (graph.inspector && canvas.clientWidth <= 700 ? 0.5 : 1);
      graph.x = availableWidth / 2 - (node.x + node.w / 2) * graph.zoom;
      graph.y = availableHeight / 2 - (node.y + node.h / 2) * graph.zoom;
      syncGraph();
      writePrototypeState();
    }

    function zoomGraph(direction, point) {
      const canvas = root.querySelector(".wf-map-canvas");
      if (!canvas) return;
      const center = point || {
        x: canvas.clientWidth / 2,
        y: canvas.clientHeight / 2,
      };
      const zoom = Math.min(1.6, Math.max(0.4, graph.zoom + direction * 0.1));
      graph.x = center.x - ((center.x - graph.x) * zoom) / graph.zoom;
      graph.y = center.y - ((center.y - graph.y) * zoom) / graph.zoom;
      graph.zoom = zoom;
      syncGraph();
      writePrototypeState();
    }

    function threadView() {
      if (!state.threads.length)
        return '<div class="wf-heading"><h1>Threads</h1><p>Start work from a decision or capability to see its thread here.</p></div>';
      const thread =
        state.threads.find((entry) => entry.id === state.thread) ||
        state.threads.at(-1);
      const item = get(thread.item);
      return `<div class="wf-heading"><h1>Threads</h1><p>Work stays linked to the decision or capability that started it.</p></div><div class="wf-content"><div class="wf-thread-list">${state.threads.map((entry) => `<button type="button" class="wf-secondary" data-thread="${entry.id}">${escape(get(entry.item).title)}</button>`).join("")}</div><article class="wf-thread"><div class="wf-item-meta"><span class="wf-eyebrow">${item.kind === "Capability" && item.children ? "Workflow director" : "Agent thread"}</span><span class="wf-status" data-state="${thread.phase === "running" ? "running" : "resolved"}">${thread.phase === "running" ? "Started" : "Turn finished"} · simulated</span></div><h2>${escape(item.title)}</h2><div class="wf-profile"><span>${item.kind === "Delivery ticket" ? "Sol · high" : "Astra · high"}</span>${item.kind === "Capability" && item.children ? "<span>Implementation: Sol · high</span><span>Review: Astra · medium</span>" : ""}</div><section class="wf-detail-section"><h3>First message · sent automatically</h3><pre>${escape(thread.prompt)}</pre></section><div class="wf-simulation"><h3>${thread.phase === "running" ? "Agent activity" : "Turn complete"}</h3><p>${thread.phase === "running" ? (item.kind === "Capability" && item.children ? "The director is checking ready tickets. Sol high is working on “Start the thread immediately”; a fresh Astra medium review follows implementation." : "The selected skills and source context are being loaded. Human-in-the-loop work continues with the owner in this thread.") : "The turn has finished. The source ticket remains open until its resolution is recorded."}</p><p class="wf-hint">Sample activity. No provider has been called.</p></div><div class="wf-actions"><button type="button" class="wf-secondary" data-source="${item.id}">Back to source</button>${thread.phase === "running" ? `<button type="button" class="wf-secondary" data-finish="${thread.id}">Simulate finished turn</button>` : ""}${thread.phase === "finished" && !item.children && item.kind !== "Map" && item.kind !== "Capability" && item.status !== "resolved" ? `<button type="button" class="wf-secondary" data-resolve="${item.id}">Simulate recorded resolution</button>` : ""}</div></article></div>`;
    }

    function render() {
      root.dataset.variant = state.variant;
      root
        .querySelectorAll("[data-page]")
        .forEach((button) =>
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.page === state.page),
          ),
        );
      root.querySelector("#wf-thread-count").textContent = state.threads.length;
      root.querySelector("#wf-breadcrumb").textContent =
        state.page === "workflow" ? "Workflow" : "Threads";
      root.querySelector("#wf-variant-label").textContent =
        `${state.variant} · ${variants[state.variant]}`;
      if (state.page === "threads") view.innerHTML = threadView();
      else if (state.variant === "D") {
        view.innerHTML = mindMap();
        measureGraph();
        if (!graph.fitted) fitGraph(true);
        syncGraph();
      } else {
        const tabs = [
          ["frontier", "Frontier"],
          ["maps", "Maps"],
          ["decisions", "Decisions"],
          ["capabilities", "Capabilities"],
        ];
        view.innerHTML = `<div class="wf-heading"><h1>Workflow</h1><p>Find the next decision. Follow a capability through delivery.</p></div><nav class="wf-tabs" aria-label="Workflow views">${tabs.map(([key, name]) => `<button type="button" data-section="${key}" aria-pressed="${state.section === key}">${name}</button>`).join("")}</nav><div class="wf-content">${state.variant === "A" || state.section === "maps" ? `<div class="wf-workspace"><div>${listContent()}</div>${detail()}</div>` : state.variant === "B" ? board() : outline()}</div>`;
      }
      writePrototypeState();
    }

    function writePrototypeState() {
      root.querySelector("#wf-state-output").textContent = JSON.stringify(
        {
          layout: variants[state.variant],
          map: {
            layout: graph.layout,
            zoom: graph.zoom,
            pan: { x: graph.x, y: graph.y },
            movedNodes: graph.positions,
            inspector: graph.inspector,
          },
          view: state.page,
          selected: get(state.selected).title,
          frontier: frontier().map((item) => item.title),
          tickets: items.map((item) => ({
            title: item.title,
            state: item.status,
            claimedBy: item.assignee || null,
          })),
          threads: state.threads.map((thread) => ({
            id: thread.id,
            source: get(thread.item).title,
            phase: thread.phase,
          })),
          storage: "memory only",
          trackerWrites: 0,
          providerCalls: 0,
        },
        null,
        2,
      );
    }

    function announce(message) {
      root.querySelector("#wf-announcement").textContent = message;
    }

    function start(id) {
      const item = get(id);
      const existing = state.threads.find((thread) => thread.item === id);
      if (existing) {
        state.thread = existing.id;
        state.page = "threads";
        render();
        return;
      }
      if (item.status !== "ready" || item.assignee || openBlockers(item).length)
        return;
      const thread = {
        id: `thread-${state.threads.length + 1}`,
        item: id,
        phase: "running",
        prompt: promptFor(item),
      };
      state.threads.push(thread);
      state.thread = thread.id;
      state.page = "threads";
      item.status = "running";
      item.assignee = "Flow-Fly";
      if (item.children) {
        const ticket = item.children
          .map(get)
          .find(
            (child) => child.status === "ready" && !openBlockers(child).length,
          );
        if (ticket) {
          ticket.status = "running";
          ticket.assignee = "Sol high";
        }
      }
      render();
      announce("Thread created and instructions sent · simulated.");
    }

    function setVariant(key) {
      state.variant = variants[key] ? key : "A";
      state.page = "workflow";
      if (location.protocol === "http:" || location.protocol === "https:") {
        const url = new URL(location.href);
        url.searchParams.set("variant", state.variant);
        history.replaceState(null, "", url);
      }
      render();
      announce(`Layout ${state.variant}: ${variants[state.variant]}.`);
    }

    let graphDrag = null;
    let suppressGraphClick = false;

    root.addEventListener("click", (event) => {
      if (suppressGraphClick) {
        suppressGraphClick = false;
        event.preventDefault();
        return;
      }
      const button = event.target.closest("button");
      if (!button || button.disabled) return;
      const data = button.dataset;
      if ("mapZoom" in data) {
        zoomGraph(Number(data.mapZoom));
        return;
      }
      if ("mapFit" in data) {
        fitGraph();
        return;
      }
      if ("closeInspector" in data) {
        graph.inspector = false;
        render();
        root
          .querySelector(`[data-node="${state.selected}"] .wf-node-main`)
          ?.focus({ preventScroll: true });
        return;
      }
      if (data.toggle) {
        graph[data.toggle] = !graph[data.toggle];
        render();
        return;
      }
      if (data.cycle) {
        const keys = Object.keys(variants);
        setVariant(
          keys[
            (keys.indexOf(state.variant) + Number(data.cycle) + keys.length) %
              keys.length
          ],
        );
        return;
      }
      if (data.start) {
        start(data.start);
        return;
      }
      if (data.page) state.page = data.page;
      if (data.section) {
        state.section = data.section;
        state.selected = {
          frontier: frontier()[0]?.id || "layout",
          maps: "specmap",
          decisions: "scope",
          capabilities: "capability",
        }[data.section];
      }
      if (data.select) {
        state.selected = data.select;
        state.page = "workflow";
        if (state.variant === "D") graph.inspector = true;
      }
      if (data.source) {
        state.selected = data.source;
        state.page = "workflow";
        if (state.variant === "D") graph.inspector = true;
      }
      if (data.thread) {
        state.thread = data.thread;
        state.page = "threads";
      }
      if (data.finish)
        state.threads.find((thread) => thread.id === data.finish).phase =
          "finished";
      if (data.resolve) {
        const item = get(data.resolve);
        item.status = "resolved";
        item.assignee = null;
        item.resolution = "Sample resolution recorded after owner discussion.";
        for (const candidate of items)
          if (candidate.status === "blocked" && !openBlockers(candidate).length)
            candidate.status = "ready";
        announce(
          "Sample resolution recorded. The frontier has been recalculated.",
        );
      }
      render();
      if (state.variant === "D" && (data.select || data.source)) {
        focusGraph(state.selected);
        root
          .querySelector("[data-close-inspector]")
          ?.focus({ preventScroll: true });
      }
    });

    root.addEventListener("change", (event) => {
      if (!event.target.matches("[data-map-layout]")) return;
      graph.layout = event.target.value;
      graph.positions = {};
      graph.fitted = false;
      graph.inspector = false;
      render();
      fitGraph();
    });

    root.addEventListener("pointerdown", (event) => {
      const canvas = event.target.closest(".wf-map-canvas");
      if (
        !canvas ||
        event.button !== 0 ||
        event.target.closest(
          ".wf-map-inspector, .wf-map-controls, .wf-node-expand",
        )
      )
        return;
      const element = event.target.closest("[data-node]");
      const node =
        element &&
        mapModel.nodes.find(
          (candidate) => candidate.id === element.dataset.node,
        );
      const capture = event.target.closest(".wf-node-main") || canvas;
      graphDrag = {
        pointer: event.pointerId,
        canvas,
        capture,
        node,
        element,
        clientX: event.clientX,
        clientY: event.clientY,
        x: node?.x ?? graph.x,
        y: node?.y ?? graph.y,
        moved: false,
      };
      capture.setPointerCapture(event.pointerId);
    });

    root.addEventListener("pointermove", (event) => {
      if (!graphDrag || graphDrag.pointer !== event.pointerId) return;
      const dx = event.clientX - graphDrag.clientX;
      const dy = event.clientY - graphDrag.clientY;
      if (!graphDrag.moved && Math.hypot(dx, dy) < 5) return;
      graphDrag.moved = true;
      graphDrag.canvas.dataset.dragging = "true";
      if (graphDrag.node) {
        const position = {
          x: graphDrag.x + dx / graph.zoom,
          y: graphDrag.y + dy / graph.zoom,
        };
        graph.positions[graphDrag.node.id] = position;
        Object.assign(graphDrag.node, position);
        graphDrag.element.style.left = `${position.x}px`;
        graphDrag.element.style.top = `${position.y}px`;
        graphDrag.canvas.querySelector(".wf-map-edges").innerHTML =
          graphEdges();
      } else {
        graph.x = graphDrag.x + dx;
        graph.y = graphDrag.y + dy;
        syncGraph();
      }
    });

    function endGraphDrag(event) {
      if (!graphDrag || graphDrag.pointer !== event.pointerId) return;
      suppressGraphClick = graphDrag.moved && event.type !== "pointercancel";
      graphDrag.canvas.dataset.dragging = "false";
      if (graphDrag.capture.hasPointerCapture(event.pointerId))
        graphDrag.capture.releasePointerCapture(event.pointerId);
      graphDrag = null;
      writePrototypeState();
    }
    root.addEventListener("pointerup", endGraphDrag);
    root.addEventListener("pointercancel", endGraphDrag);
    root.addEventListener(
      "wheel",
      (event) => {
        const canvas = event.target.closest(".wf-map-canvas");
        if (
          !canvas ||
          event.target.closest(".wf-map-inspector") ||
          !(event.ctrlKey || event.metaKey)
        )
          return;
        event.preventDefault();
        const bounds = canvas.getBoundingClientRect();
        zoomGraph(event.deltaY < 0 ? 1 : -1, {
          x: event.clientX - bounds.left,
          y: event.clientY - bounds.top,
        });
      },
      { passive: false },
    );

    root.addEventListener("focusin", (event) => {
      const element = event.target.closest("[data-node]");
      const canvas = root.querySelector(".wf-map-canvas");
      if (!element || !canvas) return;
      const bounds = canvas.getBoundingClientRect();
      const node = element.getBoundingClientRect();
      if (
        node.left < bounds.left ||
        node.right > bounds.right ||
        node.top < bounds.top ||
        node.bottom > bounds.bottom
      )
        focusGraph(element.dataset.node);
    });

    window.addEventListener("resize", () => {
      if (state.variant === "D" && state.page === "workflow") {
        if (graph.inspector) focusGraph(state.selected);
        else fitGraph(true);
      }
    });

    root.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && graph.inspector) {
        graph.inspector = false;
        render();
        root
          .querySelector(`[data-node="${state.selected}"] .wf-node-main`)
          ?.focus({ preventScroll: true });
        return;
      }
      if (
        event.target.closest(
          "input, textarea, select, button, summary, [contenteditable]",
        )
      )
        return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const keys = Object.keys(variants);
      setVariant(
        keys[
          (keys.indexOf(state.variant) +
            (event.key === "ArrowRight" ? 1 : -1) +
            keys.length) %
            keys.length
        ],
      );
    });

    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({
        container: root,
        onChange: () => setVariant(state.variant),
      });
      tweak.addSelect(state, "variant", {

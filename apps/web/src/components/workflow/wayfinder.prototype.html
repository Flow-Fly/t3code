        summary:
          "A sample map whose decisions are resolved and remaining fog is cleared. Its next step is a specification.",
        status: "ready",
        blockers: [],
        skill: "$to-spec",
        sample: true,
      },
      {
        id: "unsliced",
        kind: "Capability",
        title: "Keep project context with every thread",
        summary:
          "An approved sample specification ready to be split into independently verifiable delivery tickets.",
        status: "ready",
        blockers: [],
        skill: "$to-tickets",
        approved: true,
        sample: true,
      },
    ];
    const get = (id) => items.find((item) => item.id === id);
    const escape = (value) =>
      String(value).replace(
        /[&<>"']/g,
        (char) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[char],
      );
    const decisionItems = () =>
      items.filter(
        (item) => item.kind === "Decision" || item.kind === "Research",
      );
    const labels = {
      ready: "Ready",
      running: "In progress",
      blocked: "Blocked",
      resolved: "Resolved",
      approval: "Needs approval",
    };
    const status = (item) =>
      `<span class="wf-status" data-state="${item.status}">${labels[item.status]}</span>`;
    const openBlockers = (item) =>
      item.blockers.map(get).filter((blocker) => blocker.status !== "resolved");
    const frontier = () =>
      decisionItems().filter(
        (item) =>
          item.status === "ready" &&
          !item.assignee &&
          openBlockers(item).length === 0,
      );

    function row(item) {
      return `<button type="button" class="wf-item" data-select="${item.id}" aria-pressed="${state.selected === item.id}"><span><span class="wf-eyebrow">${item.kind}${item.sample ? " · example" : ""}</span><span class="wf-item-title">${escape(item.title)}</span></span><span class="wf-item-meta">${status(item)}${item.assignee ? `<span>${item.assignee}</span>` : ""}</span></button>`;
    }

    function group(title, list) {
      return `<section class="wf-group"><div class="wf-group-title"><h3>${title}</h3><span class="wf-count">${list.length}</span></div>${list.length ? list.map(row).join("") : '<p class="wf-empty">No items here.</p>'}</section>`;
    }

    function promptFor(item) {
      const source =
        item.url || `[sample ${item.kind.toLowerCase()}: ${item.title}]`;
      if (item.skill === "$to-spec")
        return `$to-spec\n\nRead the map ${source}, its resolution comments and standing notes. Its decision work and remaining fog are complete. Synthesize the capability specification from those decisions. Confirm the testing seams, publish the spec, and wait for owner approval before $to-tickets.`;
      if (item.skill === "$to-tickets")
        return `$to-tickets\n\nRead the approved capability specification ${source}. Propose tracer-bullet delivery tickets and genuine blocking edges. Get owner approval of the breakdown before publishing. Mark only the executable frontier ready-for-agent.`;
      if (item.kind === "Capability")
        return `Act as workflow-director for ${source}.\nDirector: Astra high. Implementation subagents: Sol high using $implement. Independent review: Astra medium using $code-review.\n\nRead the full approved specification, child tickets, dependencies and live readiness labels. Execute only approved, unblocked work. Give each worker explicit write ownership. Preserve spec source, fixed point, exact implementation head and verification evidence for fresh review. Re-read tracker state before selecting the next ticket. Pause for unresolved product decisions. Apply the repository's approval rules for merges.`;
      if (item.kind === "Delivery ticket")
        return `$implement\n\nWork on ${source}, under its approved capability. Re-read acceptance criteria, readiness and blockers before editing. Return spec source, fixed point, exact head and verification evidence to the director. Independent $code-review follows in a fresh Astra medium session.`;
      return `$wayfinder https://github.com/Flow-Fly/t3code/issues/1\nWork on the decision “${item.title}”: ${source}\n\nUse ${item.kind === "Research" ? "$research" : item.id === "layout" ? "$prototype" : "$grill-with-docs ($grilling and $domain-modeling)"}. Read map notes and relevant resolution comments. Re-read live blockers and assignee, claim this ticket before work, and resolve at most this one decision. Record the answer in a resolution comment and update the map's index and newly visible frontier. Human-in-the-loop decisions require the owner's live answers.`;
    }

    function actionLabel(item) {
      if (state.threads.some((thread) => thread.item === item.id))
        return "Open thread";
      if (item.status === "resolved") return "Resolved";
      if (openBlockers(item).length) return "Waiting on blockers";
      if (item.assignee) return "Already claimed";
      if (item.kind === "Capability" && item.children) return "Start director";
      if (item.skill === "$to-spec") return "Start $to-spec";
      if (item.skill === "$to-tickets") return "Start $to-tickets";
      return "Start work";
    }

    function ticketRows(ids) {
      return ids
        .map(get)
        .map(
          (item) =>
            `<button type="button" class="wf-ticket" data-select="${item.id}"><span>${escape(item.title)}<small>${escape(item.summary)}</small></span>${status(item)}</button>`,
        )
        .join("");
    }

    function detail() {
      const item = get(state.selected);
      const blockers = openBlockers(item);
      const hasThread = state.threads.some((thread) => thread.item === item.id);
      const disabled =
        !hasThread &&
        (item.status === "resolved" ||
          item.status === "blocked" ||
          item.assignee ||
          blockers.length);
      const children = (item.children || []).map(get);
      const done = children.filter(
        (ticket) => ticket.status === "resolved",
      ).length;
      const director =
        item.parent &&
        state.threads.find((thread) => thread.item === item.parent);
      return `<article class="wf-detail" aria-label="Selected work details"><div class="wf-item-meta"><span class="wf-eyebrow">${item.kind}${item.sample ? " · example" : ""}</span>${status(item)}</div><h2>${escape(item.title)}</h2><p class="wf-description">${escape(item.summary)}</p>
      ${item.question ? `<section class="wf-detail-section"><h3>Question to settle</h3><p>${escape(item.question)}</p></section>` : ""}
      ${item.resolution ? `<section class="wf-detail-section"><h3>Decision</h3><p>${escape(item.resolution)}</p></section>` : ""}
      ${children.length ? `<section class="wf-detail-section"><div class="wf-group-title"><h3>Delivery tickets</h3><span class="wf-count">${done} of ${children.length} resolved</span></div><progress value="${done}" max="${children.length}" aria-label="Resolved delivery tickets"></progress>${ticketRows(item.children)}</section>` : ""}
      ${blockers.length ? `<section class="wf-detail-section"><h3>Blocked by</h3>${blockers.map(row).join("")}</section>` : ""}
      ${item.parent ? `<div class="wf-detail-section wf-actions"><button type="button" class="wf-secondary" data-select="${item.parent}">Back to capability</button>${director ? `<button type="button" class="wf-secondary" data-thread="${director.id}">Open director thread</button>` : ""}</div>` : ""}
      ${item.approved ? '<p class="wf-hint">Sample spec: owner approval recorded. Ticket breakdown still needs approval.</p>' : ""}
      <section class="wf-detail-section"><h3>${item.kind === "Capability" && item.children ? "Workflow director" : "Agent instructions"}</h3><div class="wf-profile"><span>${item.kind === "Delivery ticket" ? "Sol · high" : "Astra · high"}</span>${item.kind === "Capability" && item.children ? "<span>Build: Sol · high</span><span>Review: Astra · medium</span>" : ""}</div><p class="wf-hint">${escape(item.skill)}</p><details style="margin-top:12px"><summary>View prepared instructions</summary><pre>${escape(promptFor(item))}</pre></details><div class="wf-actions"><button type="button" class="wf-primary" data-start="${item.id}" ${disabled ? "disabled" : ""}>${actionLabel(item)}${disabled ? "" : " ↗"}</button>${item.url ? `<a href="${item.url}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>` : ""}</div><p class="wf-hint">${hasThread ? "Return to the linked thread." : disabled ? "Browse details while this work is unavailable." : "Creates a thread and sends the instructions immediately."}</p></section></article>`;
    }

    function listContent() {
      if (state.section === "capabilities")
        return group(
          "Capabilities",
          items.filter((item) => item.kind === "Capability"),
        );
      if (state.section === "decisions")
        return (
          group(
            "Decisions so far",
            decisionItems().filter((item) => item.status === "resolved"),
          ) +
          group(
            "Open decisions",
            decisionItems().filter((item) => item.status !== "resolved"),
          )
        );
      if (state.section === "maps")
        return (
          `<section class="wf-group"><div class="wf-eyebrow">Wayfinder map</div><h2 style="margin:9px 0">Bring workflow tracking into T3 Code</h2><p class="wf-muted">Find the route from a workflow view to correctly instructed agent work.</p><div class="wf-detail-section"><h3>Destination</h3><p class="wf-muted">A prototype-informed, owner-approved specification for web and desktop.</p></div><div class="wf-detail-section"><h3>Not yet specified</h3><ul><li>Many projects and simultaneous capabilities</li><li>Existing trackers with different conventions</li><li>Reopened and superseded work</li></ul></div><div class="wf-detail-section"><h3>Out of scope</h3><p class="wf-muted">Mobile for the first version; automatic approval or merge authority.</p></div><div class="wf-actions"><a href="https://github.com/Flow-Fly/t3code/issues/1" target="_blank" rel="noopener noreferrer">Open planning map ↗</a></div></section>` +
          group("Ready for specification · example", [get("specmap")])
        );
      return (
        group("Frontier", frontier()) +
        group(
          "In progress",
          decisionItems().filter((item) => item.status === "running"),
        ) +
        `<details class="wf-group"><summary>Blocked decisions · ${decisionItems().filter((item) => item.status === "blocked").length}</summary>${decisionItems()
          .filter((item) => item.status === "blocked")
          .map(row)
          .join("")}</details>`
      );
    }

    function board() {
      const list =
        state.section === "capabilities"
          ? items.filter((item) => item.kind === "Capability" || item.parent)
          : decisionItems();
      const lanes = [
        ["Ready", ["ready"]],
        ["In progress", ["running"]],
        ["Blocked / resolved", ["blocked", "resolved"]],
      ];
      return `<div class="wf-board">${lanes
        .map(
          ([title, states]) =>
            `<section class="wf-lane"><h3>${title}</h3>${
              list
                .filter((item) => states.includes(item.status))
                .map(row)
                .join("") || '<p class="wf-empty">No work here.</p>'
            }</section>`,
        )
        .join("")}</div>${detail()}`;
    }

    function outline() {
      return `<div class="wf-outline"><details open><summary>Wayfinder · Bring workflow tracking into T3 Code</summary><div class="wf-branch">${decisionItems().map(row).join("")}</div></details><details open><summary>Capability · Start agent work from the workflow</summary><div class="wf-branch">${row(get("capability"))}${get("capability").children.map(get).map(row).join("")}</div></details><details><summary>Next handoffs · examples</summary><div class="wf-branch">${row(get("specmap"))}${row(get("unsliced"))}</div></details></div>${detail()}`;
    }

    function threadView() {
      if (!state.threads.length)
        return '<div class="wf-heading"><h1>Threads</h1><p>Start work from a decision or capability to see its thread here.</p></div>';
      const thread =
        state.threads.find((entry) => entry.id === state.thread) ||
        state.threads.at(-1);
      const item = get(thread.item);
      return `<div class="wf-heading"><h1>Threads</h1><p>Work stays linked to the decision or capability that started it.</p></div><div class="wf-content"><div class="wf-thread-list">${state.threads.map((entry) => `<button type="button" class="wf-secondary" data-thread="${entry.id}">${escape(get(entry.item).title)}</button>`).join("")}</div><article class="wf-thread"><div class="wf-item-meta"><span class="wf-eyebrow">${item.kind === "Capability" && item.children ? "Workflow director" : "Agent thread"}</span><span class="wf-status" data-state="${thread.phase === "running" ? "running" : "resolved"}">${thread.phase === "running" ? "Started" : "Turn finished"} · simulated</span></div><h2>${escape(item.title)}</h2><div class="wf-profile"><span>${item.kind === "Delivery ticket" ? "Sol · high" : "Astra · high"}</span>${item.kind === "Capability" && item.children ? "<span>Implementation: Sol · high</span><span>Review: Astra · medium</span>" : ""}</div><section class="wf-detail-section"><h3>First message · sent automatically</h3><pre>${escape(thread.prompt)}</pre></section><div class="wf-simulation"><h3>${thread.phase === "running" ? "Agent activity" : "Turn complete"}</h3><p>${thread.phase === "running" ? (item.kind === "Capability" && item.children ? "The director is checking ready tickets. Sol high is working on “Start the thread immediately”; a fresh Astra medium review follows implementation." : "The selected skills and source context are being loaded. Human-in-the-loop work continues with the owner in this thread.") : "The turn has finished. The source ticket remains open until its resolution is recorded."}</p><p class="wf-hint">Sample activity. No provider has been called.</p></div><div class="wf-actions"><button type="button" class="wf-secondary" data-source="${item.id}">Back to source</button>${thread.phase === "running" ? `<button type="button" class="wf-secondary" data-finish="${thread.id}">Simulate finished turn</button>` : ""}${thread.phase === "finished" && !item.children && item.kind !== "Map" && item.kind !== "Capability" && item.status !== "resolved" ? `<button type="button" class="wf-secondary" data-resolve="${item.id}">Simulate recorded resolution</button>` : ""}</div></article></div>`;
    }

    function render() {
      root
        .querySelectorAll("[data-page]")
        .forEach((button) =>
          button.setAttribute(
            "aria-pressed",
            String(button.dataset.page === state.page),
          ),
        );
      root.querySelector("#wf-thread-count").textContent = state.threads.length;
      root.querySelector("#wf-breadcrumb").textContent =
        state.page === "workflow" ? "Workflow" : "Threads";
      root.querySelector("#wf-variant-label").textContent =
        `${state.variant} · ${variants[state.variant]}`;
      if (state.page === "threads") view.innerHTML = threadView();
      else {
        const tabs = [
          ["frontier", "Frontier"],
          ["maps", "Maps"],
          ["decisions", "Decisions"],
          ["capabilities", "Capabilities"],
        ];
        view.innerHTML = `<div class="wf-heading"><h1>Workflow</h1><p>Find the next decision. Follow a capability through delivery.</p></div><nav class="wf-tabs" aria-label="Workflow views">${tabs.map(([key, name]) => `<button type="button" data-section="${key}" aria-pressed="${state.section === key}">${name}</button>`).join("")}</nav><div class="wf-content">${state.variant === "A" || state.section === "maps" ? `<div class="wf-workspace"><div>${listContent()}</div>${detail()}</div>` : state.variant === "B" ? board() : outline()}</div>`;
      }
      root.querySelector("#wf-state-output").textContent = JSON.stringify(
        {
          layout: variants[state.variant],
          view: state.page,
          selected: get(state.selected).title,
          frontier: frontier().map((item) => item.title),
          tickets: items.map((item) => ({
            title: item.title,
            state: item.status,
            claimedBy: item.assignee || null,
          })),
          threads: state.threads.map((thread) => ({
            id: thread.id,
            source: get(thread.item).title,
            phase: thread.phase,
          })),
          storage: "memory only",
          trackerWrites: 0,
          providerCalls: 0,
        },
        null,
        2,
      );
    }

    function announce(message) {
      root.querySelector("#wf-announcement").textContent = message;
    }

    function start(id) {
      const item = get(id);
      const existing = state.threads.find((thread) => thread.item === id);
      if (existing) {
        state.thread = existing.id;
        state.page = "threads";
        render();
        return;
      }
      if (item.status !== "ready" || item.assignee || openBlockers(item).length)
        return;
      const thread = {
        id: `thread-${state.threads.length + 1}`,
        item: id,
        phase: "running",
        prompt: promptFor(item),
      };
      state.threads.push(thread);
      state.thread = thread.id;
      state.page = "threads";
      item.status = "running";
      item.assignee = "Flow-Fly";
      if (item.children) {
        const ticket = item.children
          .map(get)
          .find(
            (child) => child.status === "ready" && !openBlockers(child).length,
          );
        if (ticket) {
          ticket.status = "running";
          ticket.assignee = "Sol high";
        }
      }
      render();
      announce("Thread created and instructions sent · simulated.");
    }

    function setVariant(key) {
      state.variant = variants[key] ? key : "A";
      state.page = "workflow";
      if (location.protocol === "http:" || location.protocol === "https:") {
        const url = new URL(location.href);
        url.searchParams.set("variant", state.variant);
        history.replaceState(null, "", url);
      }
      render();
      announce(`Layout ${state.variant}: ${variants[state.variant]}.`);
    }

    root.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button || button.disabled) return;
      const data = button.dataset;
      if (data.cycle) {
        const keys = Object.keys(variants);
        setVariant(
          keys[
            (keys.indexOf(state.variant) + Number(data.cycle) + keys.length) %
              keys.length
          ],
        );
        return;
      }
      if (data.start) {
        start(data.start);
        return;
      }
      if (data.page) state.page = data.page;
      if (data.section) {
        state.section = data.section;
        state.selected = {
          frontier: frontier()[0]?.id || "layout",
          maps: "specmap",
          decisions: "scope",
          capabilities: "capability",
        }[data.section];
      }
      if (data.select) {
        state.selected = data.select;
        state.page = "workflow";
      }
      if (data.source) {
        state.selected = data.source;
        state.page = "workflow";
      }
      if (data.thread) {
        state.thread = data.thread;
        state.page = "threads";
      }
      if (data.finish)
        state.threads.find((thread) => thread.id === data.finish).phase =
          "finished";
      if (data.resolve) {
        const item = get(data.resolve);
        item.status = "resolved";
        item.assignee = null;
        item.resolution = "Sample resolution recorded after owner discussion.";
        for (const candidate of items)
          if (candidate.status === "blocked" && !openBlockers(candidate).length)
            candidate.status = "ready";
        announce(
          "Sample resolution recorded. The frontier has been recalculated.",
        );
      }
      render();
    });

    root.addEventListener("keydown", (event) => {
      if (
        event.target.closest(
          "input, textarea, select, button, summary, [contenteditable]",
        )
      )
        return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const keys = Object.keys(variants);
      setVariant(
        keys[
          (keys.indexOf(state.variant) +
            (event.key === "ArrowRight" ? 1 : -1) +
            keys.length) %
            keys.length
        ],
      );
    });

    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({
        container: root,
        onChange: () => setVariant(state.variant),
      });
      tweak.addSelect(state, "variant", {
        label: "Workflow layout",
        options: [
          { label: "A · Workspace", value: "A" },
          { label: "B · Board", value: "B" },
          { label: "C · Outline", value: "C" },
        ],
      });
    }
  })();
</script>
